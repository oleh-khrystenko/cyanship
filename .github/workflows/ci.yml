name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    quality:
        name: Lint & Build
        runs-on: ubuntu-latest

        env:
            WEB_URL: http://localhost:3000
            R2_PUBLIC_URL: https://media.cyanship.com
            API_INTERNAL_URL: http://localhost:4000
            NEXT_PUBLIC_TURNSTILE_SITE_KEY: '0x0000000000000000000000'

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: corepack enable

            - uses: actions/cache@v4
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-

            - run: pnpm install --frozen-lockfile

            - run: pnpm lint

            - run: pnpm build

    test:
        name: API Tests
        runs-on: ubuntu-latest

        # No MongoDB service: unit tests mock the models and e2e boots its own
        # MongoMemoryServer. Env comes from apps/api/src/test-setup.ts.
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: corepack enable

            - uses: actions/cache@v4
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-

            # Keeps the ~120 MB mongod download out of every run; the e2e
            # globalSetup still warms it from scratch whenever this cache misses.
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: mongodb-binaries-${{ runner.os }}-

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter api test

            # E2E boots the real Nest module graph against MongoMemoryServer —
            # it is what catches DI/contract drift that unit tests mock away.
            - run: pnpm --filter api test:e2e
