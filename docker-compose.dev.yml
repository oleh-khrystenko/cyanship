services:
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - redis_data_dev:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s

    api:
        image: node:20-alpine
        working_dir: /app
        command: >
            sh -c "corepack enable &&
            pnpm install --frozen-lockfile
            --filter ./apps/api...
            --filter ./packages/types... &&
            pnpm --filter ./packages/types build &&
            pnpm --filter ./apps/api dev"
        environment:
            - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            - PNPM_STORE_DIR=/pnpm-store
            - CI=true
            - NODE_ENV=development
            - API_PORT=${API_PORT}
            - MONGODB_URI=${MONGODB_URI}
            - REDIS_URL=redis://redis:6379
            - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            - WEB_URL=http://localhost:${WEB_PORT}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
            - RESEND_API_KEY=${RESEND_API_KEY}
            - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
            - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            - TSC_WATCHFILE=UsePolling
            - TSC_WATCHDIRECTORY=UsePolling
        ports:
            - '${API_PORT}:${API_PORT}'
        volumes:
            - ./:/app
            - pnpm-store:/pnpm-store
            - /app/node_modules
        depends_on:
            redis:
                condition: service_healthy
        # Readiness lags container start by the whole `pnpm install` + build +
        # Nest compile chain, which runs at runtime here (no image layer to bake
        # it into) — minutes on a cold pnpm store. The start period only bounds
        # how long that may take: the first successful probe ends it immediately,
        # and an env fail-fast crash exits the container, which compose reports
        # to dependents without waiting this out.
        healthcheck:
            test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${API_PORT}/api/health"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 600s

    web:
        image: node:20-alpine
        working_dir: /app
        command: >
            sh -c "corepack enable &&
            pnpm install --frozen-lockfile
            --filter ./apps/web...
            --filter ./packages/types... &&
            pnpm --filter ./packages/types build &&
            pnpm --filter ./apps/web dev"
        environment:
            - CI=true
            - NODE_ENV=development
            - NEXT_TELEMETRY_DISABLED=1
            - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            - PNPM_STORE_DIR=/pnpm-store
            - PORT=${WEB_PORT}
            - API_INTERNAL_URL=http://api:${API_PORT}
            - WEB_URL=http://localhost:${WEB_PORT}
            - R2_PUBLIC_URL=${R2_PUBLIC_URL}
            - WATCHPACK_POLLING=true
            - CHOKIDAR_USEPOLLING=true
        ports:
            - '${WEB_PORT}:${WEB_PORT}'
        volumes:
            - ./:/app
            - pnpm-store:/pnpm-store
            - /app/node_modules
        # `service_started` is not enough: Next serves the first page in seconds
        # while the API is still installing, and `AuthInitializer` proxies
        # /api/auth/refresh into a closed port.
        depends_on:
            api:
                condition: service_healthy

volumes:
    redis_data_dev:
    pnpm-store:
