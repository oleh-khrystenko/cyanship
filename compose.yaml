services:
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        networks:
            - internal
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s

    api:
        build:
            context: .
            dockerfile: ./apps/api/Dockerfile
        restart: unless-stopped
        environment:
            - NODE_ENV=${NODE_ENV}
            - API_PORT=${API_PORT}
            - MONGODB_URI=${MONGODB_URI}
            - REDIS_URL=redis://redis:6379
            - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            - WEB_URL=${WEB_URL}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
            - RESEND_API_KEY=${RESEND_API_KEY}
            - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
            - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
            - BRIEF_NOTIFICATION_EMAIL=${BRIEF_NOTIFICATION_EMAIL}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            - R2_BUCKET_NAME=${R2_BUCKET_NAME}
            - R2_PUBLIC_URL=${R2_PUBLIC_URL}
        depends_on:
            - redis
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${API_PORT}/api/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    web:
        build:
            context: .
            dockerfile: ./apps/web/Dockerfile
            args:
                API_INTERNAL_URL: http://api:${API_PORT}
                WEB_URL: ${WEB_URL}
                R2_PUBLIC_URL: ${R2_PUBLIC_URL}
                NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
                NEXT_PUBLIC_DEMO_VIDEO_PATH: ${NEXT_PUBLIC_DEMO_VIDEO_PATH}
                NEXT_PUBLIC_DEMO_VIDEO_POSTER_PATH: ${NEXT_PUBLIC_DEMO_VIDEO_POSTER_PATH}
        restart: unless-stopped
        environment:
            - NODE_ENV=${NODE_ENV}
            - PORT=${WEB_PORT}
            - API_INTERNAL_URL=http://api:${API_PORT}
            - WEB_URL=${WEB_URL}
            - R2_PUBLIC_URL=${R2_PUBLIC_URL}
        ports:
            - '127.0.0.1:${WEB_PORT}:${WEB_PORT}'
        depends_on:
            - api
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "wget --spider -q http://$$HOSTNAME:${WEB_PORT}/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

networks:
    internal:
        driver: bridge

volumes:
    redis_data:
